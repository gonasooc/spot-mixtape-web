name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # GitHub labels the checkbox with this description and never shows the
      # input name, so the name has to lead it.
      allow_placeholders:
        description: "allow_placeholders: publish with REQUIRED values still in site.ts (plumbing check only)"
        type: boolean
        default: false

# GITHUB_TOKEN needs id-token for the Pages deployment's OIDC exchange.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The privacy policy and terms render straight from site.ts, so a
      # placeholder here would publish "REQUIRED 사업자 상호" as legal text.
      - name: Check legal config
        if: ${{ inputs.allow_placeholders != true }}
        run: pnpm run config:check

      - run: pnpm run build

      # The app hardcodes these paths and the store consoles are filed with
      # them, so a build that silently stops emitting one must not deploy.
      - name: Verify required pages exist
        run: |
          for page in index.html privacy.html terms.html account-deletion.html; do
            test -f "dist/$page" || { echo "missing dist/$page"; exit 1; }
          done

      # The artifact tar drops dotfiles unless told otherwise, which would
      # leave public/.nojekyll out of the published site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
